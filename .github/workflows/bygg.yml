name: Bygg

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  bygg:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'   # SDK-en bygger både .NET Framework 4.8-programmet og testene

      - name: Bygg alt
        run: dotnet build AISkanner.sln -c Release

      - name: Røyktest (skanner byggemaskinen og skriver JSON)
        shell: pwsh
        run: |
          dotnet run --project src/AISkanner.Cli -c Release --no-build | Out-File skann.json -Encoding utf8
          # Exit-kode 0/1/2 betyr ingen/gule/røde funn. Alt annet er en feil.
          if ($LASTEXITCODE -gt 2) { exit 1 }
          Get-Content skann.json | ConvertFrom-Json | Out-Null
          # Ellers arver steget exit-koden 1/2 fra skanningen og feiler
          exit 0

      # Ingen vinduer i bakgrunnen: programmet starter bare to andre prosesser, begge etter et klikk
      # (seg selv som administrator, og Utforsker for «Vis i mappe»). Nye Process.Start stopper bygget.
      - name: Sjekk at ingen prosesser åpner vinduer
        shell: pwsh
        run: |
          $treff = @(Get-ChildItem src -Recurse -Filter *.cs | Where-Object { $_.FullName -notmatch '\\(obj|bin)\\' } | Select-String -Pattern 'Process\.Start\(|CreateProcess|ShellExecute\(' )
          $treff | ForEach-Object { "::notice title=Prosesser::$($_.Path):$($_.LineNumber)" }
          if ($treff.Count -ne 2) { "::error title=Prosesser::Forventet 2 steder som starter prosesser, fant $($treff.Count)"; exit 1 }

      # Vakt mot en falsk AI-agent: en kopi av cmd.exe i en sti som ligner Claude Code åpner en falsk nøkkelfil,
      # starter kodet PowerShell som slår opp webhook.site. Alt i RUNNER_TEMP, ingenting sendes andre steder.
      - name: Vakttest (falsk AI-agent)
        shell: pwsh
        run: |
          $d = Join-Path $env:RUNNER_TEMP 'vakttest'
          $agent = Join-Path $d 'node_modules\@anthropic-ai\claude-code\claude.exe'
          New-Item -ItemType Directory -Force (Split-Path $agent), (Join-Path $d '.aws') | Out-Null
          Copy-Item "$env:WINDIR\System32\cmd.exe" $agent
          Set-Content (Join-Path $d '.aws\credentials') '[kontroll]'
          $v = Start-Process dotnet -ArgumentList "run --project src/AISkanner.Cli -c Release --no-build -- --vakttest `"$d\klar.txt`"" -PassThru -NoNewWindow -RedirectStandardOutput vakt.txt
          for ($i = 0; $i -lt 120 -and -not (Test-Path "$d\klar.txt"); $i++) { Start-Sleep -Milliseconds 500 }
          Start-Sleep 2
          $enc = [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes('Resolve-DnsName webhook.site -ErrorAction SilentlyContinue | Out-Null'))
          Start-Process $agent -ArgumentList "/c type `"$d\.aws\credentials`" & powershell -NoProfile -w hidden -enc $enc" -Wait -NoNewWindow
          $v.WaitForExit()
          Get-Content vakt.txt
          if ($v.ExitCode -ne 0) { "::error title=Vakttest::Vakt så ikke alt den falske agenten gjorde"; exit 1 }

      - name: Selvtest (godkjentlista kan ikke lures)
        run: dotnet run --project src/AISkanner.Cli -c Release --no-build -- --selvtest

      - name: Kontroll (falske AI-spor i %TEMP%, alle alarmer skal slå ut)
        run: dotnet run --project src/AISkanner.Cli -c Release --no-build -- --kontroll

      - name: Bygg programmet
        run: dotnet publish src/AISkanner -c Release -o publish

      # Brukeren skal bare se én fil som heter AISkanner: AISkanner.exe. Ingen AISkanner.exe.config
      # (med skjulte filendelser ser den ut som en ekstra AISkanner.exe). Stopper hvis den kommer tilbake.
      - name: Sjekk mappa
        shell: pwsh
        run: |
          if (@(Get-ChildItem publish -Filter *.exe -File).Count -ne 1) { Write-Error "Det skal være nøyaktig én .exe"; exit 1 }
          $config = @(Get-ChildItem publish -Recurse -File -Filter *.config)
          if ($config.Count -gt 0) { Write-Error "Ingen .config i mappa: $($config.Name -join ', ')"; exit 1 }
          if (@(Get-ChildItem publish -File -Filter 'AISkanner*' | Where-Object { $_.Name -notin 'AISkanner.exe','AISkanner.Core.dll' }).Count -gt 0) { Write-Error "Bare AISkanner.exe og AISkanner.Core.dll kan hete AISkanner"; exit 1 }
          if (-not (Test-Path publish/LES-MEG-FORST.txt)) { Write-Error "Mangler LES-MEG-FORST.txt"; exit 1 }

      # Programmet slik brukeren får det: filene merkes «fra Internett» som etter nedlasting av zip, så lastes
      # bibliotekene og alle alarmene kjøres i AISkanner.exe selv (.NET Framework 4.8), uten vindu.
      - name: Lastetest (nedlastet mappe, uten .config)
        shell: pwsh
        run: |
          Copy-Item publish lastetest -Recurse
          Get-ChildItem lastetest -Recurse -File | ForEach-Object { Set-Content -Path $_.FullName -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3" }
          $p = Start-Process lastetest/AISkanner.exe -ArgumentList '--lastetest' -Wait -PassThru -NoNewWindow -RedirectStandardOutput lastetest.txt -RedirectStandardError lastetest-feil.txt
          # Hver linje som merknad, så resultatet kan leses uten hele loggen
          Get-Content lastetest.txt, lastetest-feil.txt -ErrorAction SilentlyContinue | Select-Object -First 40 | ForEach-Object { if ($_.Trim()) { "::notice title=Lastetest::$_" } }
          "::notice title=Lastetest::Avslutningskode $($p.ExitCode)"
          if ($p.ExitCode -ne 0 -or -not (Select-String -Path lastetest.txt -Pattern 'LASTETEST OK' -Quiet)) { "::error title=Lastetest::AISkanner.exe startet ikke riktig (kode $($p.ExitCode))"; exit 1 }

      # Størrelsesgrense: programmet skal være lite, som 7-Zip. Bygget stopper hvis det blir for stort.
      - name: Sjekk størrelse (maks 10 MB)
        shell: pwsh
        run: |
          $mb = [math]::Round(((Get-ChildItem publish -Recurse -File | Measure-Object Length -Sum).Sum) / 1MB, 2)
          "Størrelse: $mb MB"
          if ($mb -gt 10) { Write-Error "For stort: $mb MB (grense 10 MB)"; exit 1 }

      - name: SHA256
        shell: pwsh
        run: Get-ChildItem publish -Recurse -File | Get-FileHash -Algorithm SHA256 | Format-Table Hash, Path -AutoSize | Out-String -Width 400 | Tee-Object publish/SHA256.txt

      - uses: actions/upload-artifact@v6
        id: last-opp
        with:
          name: AISkanner-usignert
          path: publish/

      # Kodesignering via SignPath Foundation (gratis for åpen kildekode).
      # Slås på når prosjektet er godkjent og SIGNPATH_API_TOKEN er lagt inn som secret.
      # - uses: signpath/github-action-submit-signing-request@v1
      #   if: startsWith(github.ref, 'refs/tags/v')
      #   with:
      #     api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
      #     organization-id: '<fra SignPath>'
      #     project-slug: 'ai-skanner'
      #     signing-policy-slug: 'release-signing'
      #     github-artifact-id: ${{ steps.last-opp.outputs.artifact-id }}
      #     wait-for-completion: true
      #     output-artifact-directory: signert

  # Versjonstag (vX.Y.Z) → GitHub Release med zip-fila brukeren laster ned, pluss AISkanner.exe,
  # SHA256.txt og CHANGELOG.md hver for seg. Kjører bare når hele bygg-jobben over er grønn.
  utgivelse:
    needs: bygg
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v6
        with:
          name: AISkanner-usignert
          path: publish

      - name: Lag release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          v="${TAG#v}"
          test -f publish/AISkanner.exe || { echo "::error::AISkanner.exe mangler"; exit 1; }
          test -f publish/SHA256.txt || { echo "::error::SHA256.txt mangler"; exit 1; }
          if find publish -name '*.config' | grep -q .; then echo "::error::.config-fil i mappa"; exit 1; fi
          grep -q "^## \[$v\]" CHANGELOG.md || { echo "::error::CHANGELOG.md har ingen seksjon for $v"; exit 1; }
          cp CHANGELOG.md publish/
          (cd publish && zip -qr "../AI-skanner-$v.zip" .)
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {p=1; next} /^## \[/ {if (p) exit} p' CHANGELOG.md > notater.md
          printf '\n---\nLast ned **AI-skanner-%s.zip**, pakk ut og kjør AISkanner.exe. Exe-fila trenger de andre filene i zip-fila ved siden av seg.\n' "$v" >> notater.md
          gh release create "$TAG" "AI-skanner-$v.zip" publish/AISkanner.exe publish/SHA256.txt CHANGELOG.md \
            --title "AI-skanner $v" --notes-file notater.md
